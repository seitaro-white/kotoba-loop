[project]
name = "kotoba-loop"
version = "0.1.0"
description = "Toolkit for learning Japanese with vocabulary mining, Anki integration and adaptive furigana"
authors = [
    {name = "Joseph White", email = "joseph@example.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
keywords = ["anki", "japanese", "kanji", "vocabulary", "jisho", "learning", "srs", "language-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: Japanese",
    "Environment :: Console",
]
dependencies = [
    "bs4>=0.0.2",
    "click==8.1.7",
    "flask>=3.1.3",
    "inquirerpy>=0.3.4",
    "ipykernel>=6.29.5",
    "jamdict>=0.1a11.post2",
    "jamdict-data>=1.5",
    "jsonschema>=4.23.0",
    "pandas>=3.0.5",
    "pip>=25.1.1",
    "prompt-toolkit>=3.0.51",
    "pydantic>=2.11.4",
    "pydantic-settings>=2.0.0",
    "pytest==7.4.0",
    "python-dotenv>=1.2.1",
    "requests==2.31.0",
    "rich>=14.0.0",
    "scipy>=1.18.1",
    "sudachidict-core==20260428",
    "sudachipy==0.6.11",
    "tqdm>=4.67.1",
]

[project.urls]
Homepage = "https://github.com/seitaro-white/kotoba-loop"
Repository = "https://github.com/seitaro-white/kotoba-loop"
Issues = "https://github.com/seitaro-white/kotoba-loop/issues"

[project.scripts]
kotoba-loop = "kotoba_loop.cli:jisho_anki"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kotoba_loop"]

[tool.pytest.ini_options]
markers = [
    "integration: requires live AnkiConnect and collection-specific prerequisites",
]
addopts = "-m 'not integration'"
